<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login and Register</title>
    <link rel="stylesheet" href="mastatechlogin.css">
</head>
<body>
    <div class="container">
        <input type="checkbox" id="check">
        <div class="login form">
            <div class="logo">
                <img src="mastatech.png" alt="mastatech_logo">
            </div>
            
            <header>Login to MastaTech</header>
            <form method="post" action="#">
                <input type="text" placeholder="Enter your email">
                <input type="password" placeholder="Enter your password">
                <a href="mastatechnotFound.html">Forgot password</a>
                <a href="mastatechnotFound.html"><input type="button" class="button" value="Login"></a>
            </form>
            <div class="signup">
                <span class="signup">Don't have an account?
                    <label for="check">Register</label>
                </span>
                <div class="home">
                    <a href="index.html">Back to HomePage</a>
                </div>
            </div>
        </div>
        <div class="registration form">
            <div class="logo">
                <img src="mastatech.png" alt="mastatech_logo">
            </div>
            <header>Signup to MastaTech</header>
            <form method="post" action="#">
                <input type="text" placeholder="Enter your email">
                <input type="password" placeholder="create a password">
                <input type="password" placeholder="confirm your password">
                <a href="mastatechnotFound.html"><input type="button" class="button" value="signup"></a>
            </form>
            <div class="signup">
                <span class="signup"> Already have an account?
                    <label for="check">Login</label>
                </span>
                <div class="home">
                    <a href="index.html">Back to HomePage</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
